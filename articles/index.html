<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>記事一覧｜流出チェッカー</title>
<meta name="description" content="情報漏洩やパスワードの安全対策について、データをもとに解説する記事の一覧です。">

<meta property="og:type" content="website">

<style>

/* Layout: 緑のメインビジュアル帯 → 1カラムのカード（確認 → 対処 → サービス → ニュース）→ 開閉式の運営情報 */
:root{
  /* 明るいグレー基調で固定（端末のダークモード設定に関係なく、常にこの配色で表示） */
  --bg:#eef0f2; --surface:#ffffff; --ink:#1f2a30; --muted:#5f6b73; --line:#d9dde1;
  --accent:#0f6b55; --accent-ink:#ffffff; --accent-soft:#e3f1ec;
  --cat-access:#b3261e; --cat-access-bg:#fbe9e7;
  --cat-attack:#9a5c00; --cat-attack-bg:#fdf1dc;
  --cat-mistake:#1f5f9e; --cat-mistake-bg:#e6effa;
  --hero-sub:#d4ebe3;
  --safe:#1a7f4b; --warn:#9a5c00; --bad:#b3261e; --bad-bg:#fdecea; --safe-bg:#e7f5ee;
  --pr:#7a5a00; --pr-bg:#fff4d6;
  --f-display:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.75 var(--f-body);}

/* メインビジュアル */
.hero{background:var(--accent);color:var(--accent-ink)}
/* 写真：Arnold Francisca / Unsplash（Unsplashライセンス） */
.hero{background:linear-gradient(90deg,rgba(15,107,85,.95) 0%,rgba(15,107,85,.86) 45%,rgba(15,107,85,.6) 100%),url("hero-photo.jpg") center/cover no-repeat,var(--accent)}
@media (max-width:560px){.hero{background:linear-gradient(rgba(15,107,85,.86),rgba(15,107,85,.86)),url("hero-photo.jpg") 70% center/cover no-repeat,var(--accent)}}
.hero-in{max-width:900px;margin:0 auto;padding:40px max(16px,env(safe-area-inset-right,0px)) 44px max(16px,env(safe-area-inset-left,0px));display:grid;grid-template-columns:1fr 180px;gap:24px;align-items:center}
.hero-in > div{min-width:0}
.hero .eyebrow{font:600 12px var(--f-mono);letter-spacing:.12em;color:var(--hero-sub);text-transform:uppercase}
.hero h1{font:900 clamp(30px,7vw,44px)/1.2 var(--f-display);margin:6px 0 14px;text-wrap:balance}
.hero h1 .nb{display:inline-block}
.hero .sub{margin:0;display:grid;gap:4px;font-size:15px;line-height:1.6;color:var(--hero-sub)}
.hero .sub strong{color:var(--accent-ink);font-weight:700}
.hero-art{width:100%;max-width:180px;height:auto;justify-self:end}
@media (max-width:560px){
  .hero-in{grid-template-columns:1fr;position:relative;padding-top:32px}
  .hero-art{position:absolute;top:20px;right:max(14px,env(safe-area-inset-right,0px));width:min(128px,31vw);max-width:none}
  .hero .eyebrow{min-height:62px;display:flex;align-items:flex-end}
}

.wrap{max-width:900px;margin:0 auto;padding:28px max(16px,env(safe-area-inset-right,0px)) 64px max(16px,env(safe-area-inset-left,0px));display:grid;gap:28px}
.pr-bar{font-size:13px;color:var(--pr);background:var(--pr-bg);border-radius:8px;padding:8px 12px;margin:0 0 4px}
h2{font:700 20px/1.4 var(--f-display);margin:0 0 14px;display:flex;align-items:center;gap:12px;word-break:auto-phrase}
.h2t{min-width:0}
.h2t .nb{display:inline-block}
@media (max-width:560px){h2{font-size:18px}}
h3{font:700 16px/1.5 var(--f-display);margin:18px 0 4px}
p{margin:0}
.ico{flex:none;width:40px;height:40px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.ico svg{width:22px;height:22px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px}
label{display:block;font-weight:700;margin-bottom:8px}
.row{display:flex;gap:8px;flex-wrap:wrap}
input[type=password],input[type=text]{flex:1 1 220px;min-width:0;font:16px var(--f-mono);padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
button,.btn{font:700 15px var(--f-body);padding:12px 18px;border-radius:8px;border:0;background:var(--accent);color:var(--accent-ink);cursor:pointer;text-decoration:none;display:inline-block}
button.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
button:focus-visible,input:focus-visible,.btn:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.hero a:focus-visible{outline-color:var(--accent-ink)}
button:disabled{opacity:.6;cursor:wait}
.note{font-size:13px;color:var(--muted);margin-top:10px}
.result{margin-top:16px;padding:14px 16px;border-radius:8px;font-weight:700}
.result.bad{background:var(--bad-bg);color:var(--bad)}
.result.safe{background:var(--safe-bg);color:var(--safe)}
.result.err{background:var(--bg);color:var(--warn)}
.result small{display:block;font-weight:400;color:var(--ink);margin-top:4px}
.result a{color:inherit;font-weight:700}
details.faq{margin-top:14px;font-size:14px;color:var(--muted)}
details.faq summary{cursor:pointer;color:var(--accent);font-weight:700}
details.faq p{margin-top:8px}
.trust{margin-top:16px;padding:16px;border-radius:10px;background:var(--accent-soft)}
.trust h3{margin:0 0 8px;color:var(--accent)}
.trust ul{margin:0;padding-left:1.2em;display:grid;gap:6px;font-size:14px}
ol,ul.plain{margin:0;padding-left:1.3em;display:grid;gap:6px}
.tag{display:inline-block;font:700 11px var(--f-mono);letter-spacing:.08em;color:var(--pr);background:var(--pr-bg);border-radius:4px;padding:1px 6px}
.recs{display:grid;gap:12px;margin-top:4px}
.rec{display:grid;grid-template-columns:auto 1fr auto;gap:6px 16px;align-items:start;padding:16px 0;border-top:1px solid var(--line)}
.rec:first-child{border-top:0}
.rec > div{min-width:0}
.rec .name{font-weight:700;font-size:17px}
.rec .kind{font-size:12px;color:var(--muted);margin-bottom:6px}
.rec .why{margin:0;padding-left:1.1em;display:grid;gap:4px;font-size:14px}
.rec .btn{align-self:center}
.a8px{position:absolute;width:1px;height:1px;border:0}
.rank{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font:700 16px var(--f-mono);background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.rank.r1{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.rank.r2{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.rank.r3{background:var(--surface);color:var(--accent);border-color:var(--accent)}
@media (max-width:560px){.rec{grid-template-columns:auto 1fr}.rec .btn{grid-column:2;justify-self:start}}
.breaches{list-style:none;margin:0;padding:0;display:grid}
.breaches li{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 0;border-top:1px solid var(--line)}
.breaches li:first-child{border-top:0}
.b-name{font-weight:700;min-width:0;overflow-wrap:anywhere}
.b-count{font:600 14px var(--f-mono);font-variant-numeric:tabular-nums;color:var(--bad);text-align:right}
.b-meta{grid-column:1/-1;font-size:13px;color:var(--muted)}
/* ニュース一覧：種類別アイコン＋見出し＋種類チップ */
.breaches.news li{grid-template-columns:44px 1fr;gap:2px 14px;align-items:start}
.news .n-ico{grid-row:1 / span 2;width:44px;height:44px;border-radius:10px;display:grid;place-items:center}
.news .n-ico svg{width:22px;height:22px}
.news a.b-name,.news .b-meta{grid-column:2}
.n-chip{display:inline-block;font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;margin-right:4px}
.c-access{color:var(--cat-access);background:var(--cat-access-bg)}
.c-attack{color:var(--cat-attack);background:var(--cat-attack-bg)}
.c-mistake{color:var(--cat-mistake);background:var(--cat-mistake-bg)}
.c-leak{color:var(--accent);background:var(--accent-soft)}
a.b-name{grid-column:1/-1;color:var(--ink);text-decoration:none}
a.b-name:hover{color:var(--accent);text-decoration:underline}

/* 開閉式（運営者情報・プライバシーポリシー） */
.fold{padding:0}
.fold > summary{list-style:none;cursor:pointer;padding:16px 22px;display:flex;align-items:center;gap:12px;font:700 17px/1.4 var(--f-display)}
.fold > summary::-webkit-details-marker{display:none}
.fold > summary .ico{width:34px;height:34px}
.fold > summary .ico svg{width:18px;height:18px}
.fold > summary::after{content:"";margin-left:auto;width:10px;height:10px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .2s}
.fold[open] > summary::after{transform:rotate(-135deg)}
.fold .body{padding:0 22px 22px;font-size:14px}
.fold .body p + p{margin-top:8px}
.fold dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0}
.fold dt{font-weight:700;color:var(--muted)}
.fold dd{margin:0;min-width:0;overflow-wrap:anywhere}
.folds{display:grid;gap:12px}

footer{font-size:12px;color:var(--muted);display:grid;gap:6px}
a{color:var(--accent)}
footer nav{display:flex;gap:16px;flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important}html{scroll-behavior:auto}}

/* ===== 記事ページ用 ===== */
.art-hero{color:#fff;background:linear-gradient(90deg,rgba(15,107,85,.95) 0%,rgba(15,107,85,.86) 50%,rgba(15,107,85,.62) 100%),url("/hero-photo.jpg") center/cover no-repeat,var(--accent)}
.art-hero-in{max-width:760px;margin:0 auto;padding-block:28px 34px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:12px}
.art-hero .crumb,.art-hero .crumb a{color:var(--hero-sub)}
.art-hero h1{font:900 clamp(26px,6vw,40px)/1.35 var(--f-display);margin:0;color:#fff}
.art-hero h1 .nb{display:inline-block}
.art-hero h1 em{font-style:normal;color:#ffd76a}
.h1-tag{display:table;font-size:14px;font-weight:900;color:var(--accent);background:#fff;border-radius:6px;padding:3px 12px;margin-bottom:10px;letter-spacing:.02em}
.art-hero .meta{margin:0;color:var(--hero-sub);font-size:13px}
@media (max-width:560px){.art-hero{background:linear-gradient(rgba(15,107,85,.88),rgba(15,107,85,.88)),url("/hero-photo.jpg") 70% center/cover no-repeat,var(--accent)}}

.photo{margin:0;display:grid;gap:4px}
.photo img{width:100%;height:auto;border-radius:12px;display:block;aspect-ratio:640/427;object-fit:cover}
.photo figcaption{font-size:11px;color:var(--muted);text-align:right}
.topbar{background:var(--accent);color:var(--accent-ink)}
.topbar-in{max-width:900px;margin:0 auto;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;align-items:center;gap:12px}
.topbar a{color:var(--accent-ink);text-decoration:none;font-weight:700}
.topbar .to-tool{font-size:13px;border:1px solid rgba(255,255,255,.6);border-radius:999px;padding:4px 12px}
.art{max-width:760px}
.crumb{font-size:12px;color:var(--muted)}
.crumb a{color:var(--muted)}
.art h1{font:900 clamp(24px,5.4vw,34px)/1.35 var(--f-display);margin:0;text-wrap:pretty;word-break:auto-phrase}
.art .meta{font-size:13px;color:var(--muted);margin-top:8px}
.eyecatch{width:100%;height:auto;border-radius:12px;display:block;aspect-ratio:1200/630;object-fit:cover}
.prose{display:grid;gap:14px;font-size:16px}
.prose h2{font-size:22px;margin:8px 0 0;padding-left:12px;border-left:5px solid var(--accent);display:block}
.prose ul,.prose ol{margin:0;padding-left:1.3em;display:grid;gap:8px}
.prose strong{color:var(--ink)}
.note-box{font-size:13px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 14px}
/* ランキング */
.rank-list{list-style:none;margin:0;padding:0;display:grid}
.rank-list li{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:2px 10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.rank-list li:first-child{border-top:0}
.rk{font:700 14px var(--f-mono);color:var(--muted);text-align:right}
.rank-list li:nth-child(-n+3) .rk{color:var(--bad)}
.pw{font:700 15px var(--f-mono);overflow-wrap:anywhere}
.pw small{font:400 12px var(--f-body);color:var(--muted);margin-left:6px}
.cnt{font:700 14px var(--f-mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.bar{grid-column:2 / 4;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar span{display:block;height:100%;background:var(--muted)}
.rank-list li.jp .bar span{background:var(--cat-mistake)}
.rank-list li.jp .pw{color:var(--cat-mistake)}
.legend{font-size:12px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
/* チェッカーへの誘導 */
.cta{background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:20px 22px;display:grid;grid-template-columns:1fr auto;gap:10px 18px;align-items:center}
.cta p{margin:0;color:var(--hero-sub);font-size:14px}
.cta strong{display:block;color:var(--accent-ink);font-size:18px;margin-bottom:2px}
.cta .btn{background:var(--accent-ink);color:var(--accent)}
@media (max-width:560px){.cta{grid-template-columns:1fr}.cta .btn{justify-self:start}}

.alist{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.acard{display:grid;grid-template-columns:240px 1fr;gap:18px;align-items:center;text-decoration:none;color:var(--ink);padding:14px}
.acard img{width:100%;height:auto;aspect-ratio:3/2;object-fit:cover;border-radius:8px;display:block}
.acard > div{min-width:0;display:grid;gap:6px}
.acard .no{font:600 12px var(--f-mono);color:var(--accent)}
.acard strong{font:700 18px/1.5 var(--f-display);word-break:auto-phrase}
.acard .d{font-size:13px;color:var(--muted)}
.acard:hover strong{color:var(--accent);text-decoration:underline}
@media (max-width:560px){.acard{grid-template-columns:1fr}}
</style>
</head>

</div>
</body>
