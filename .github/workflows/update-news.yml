name: update-news

on:
  schedule:
    - cron: "17 * * * *"   # 毎時17分（UTC）に実行
  workflow_dispatch:        # 手動実行もできるようにする

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch news
        run: python3 scripts/fetch_news.py
      - name: Commit news.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          git diff --cached --quiet || (git commit -m "Update news.json" && git push)
